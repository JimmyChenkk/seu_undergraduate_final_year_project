experiment_name: tep_mainline_multisource_5source_6scenes_5methods_ca_ccsr_wjdot_guarded_prior_fusion
seed: 42
device: cuda:0
output_dir: runs

tracking:
  batch_root_name:

runtime:
  dry_run: false
  save_checkpoint: true
  save_analysis: true
  save_figures: true
  figure_format: pdf
  deterministic: true
  deterministic_warn_only: true
  disable_cudnn: false
  cudnn_benchmark: false
  allow_tf32: false
  matmul_precision: highest
  amp: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  non_blocking_transfers: false
  show_progress: false
  evaluation_interval: 5
  selection_interval: 5
  early_stopping_interval: 5
  final_epoch_evaluation: true
  final_selection_evaluation: true
  target_eval_during_training: false
  refresh_batch_outputs: true
  early_stopping_patience:
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 80

automation:
  methods:
    - source_only
    - codats
    - wjdot
    - ca_ccsr_wjdot
    - target_ref
  multisource_scenes:
    - mode2+mode3+mode4+mode5+mode6->mode1
    - mode1+mode3+mode4+mode5+mode6->mode2
    - mode1+mode2+mode4+mode5+mode6->mode3
    - mode1+mode2+mode3+mode5+mode6->mode4
    - mode1+mode2+mode3+mode4+mode6->mode5
    - mode1+mode2+mode3+mode4+mode5->mode6

method_overrides:
  ca_ccsr_wjdot:
    optimization: &rescue_opt
      epochs: 28
      batch_size: 32
      learning_rate: 0.00004
      weight_decay: 0.0
      max_grad_norm: 3.0
    loss: &rescue_loss
      adaptation_weight: 0.48
      source_ce_weight: 0.75
      feature_weight: 0.06
      label_weight: 1.0
      sinkhorn_reg: 0.05
      sinkhorn_num_iter_max: 70
      alignment_start_step: 0
      alignment_ramp_steps: 350
      reliability_start_ratio: 0.25
      reliability_ramp_ratio: 0.30
      reliability_total_steps: 1800
      T_class: 0.45
      top_m_per_class: 3
      floor: 0.02
      tau_proto: 0.84
      min_proto_samples: 3
      w_proto: 0.34
      w_ot: 0.36
      w_entropy: 0.18
      w_source_error: 0.12
      lambda_adv: 0.12
      lambda_ot: 0.055
      lambda_ccsr: 0.055
      lambda_teacher: 0.12
      teacher_ramp_steps: 400
      domain_adaptation_max_steps: 700
      grl_lambda: 0.45
      grl_max_iters: 700
      teacher_safe_fusion: &strong_prior_fusion
        fusion_base: prior_balanced
        prior_balance_student_mix: 0.35
        prior_balance_strength: 0.80
        prior_balance_min_prior: 0.0001
        prior_balance_student_guard: true
        student_guard_confidence_margin: 0.05
        student_guard_entropy_margin: 0.02
        lambda_same: 0.04
        lambda_override: 0.35
        override_confidence_margin: 0.08
        override_entropy_margin: 0.04
        eta_min: 0.0
        eta_max: 0.45
      wjdot_anchor_fusion:
        enabled: true
        ca_weight_by_source_count:
          2: 0.28
          5: 0.41
  m1_3_4_5_6_m2:
    ca_ccsr_wjdot:
      optimization:
        epochs: 32
        learning_rate: 0.00005
      loss:
        source_ce_weight: 0.70
        lambda_adv: 0.10
        lambda_ot: 0.070
        lambda_ccsr: 0.070
        lambda_teacher: 0.08
        w_proto: 0.30
        w_ot: 0.42
        w_entropy: 0.18
        w_source_error: 0.10
        teacher_safe_fusion: &weak_prior_fusion
          fusion_base: prior_balanced
          prior_balance_student_mix: 0.35
          prior_balance_strength: 0.80
          prior_balance_min_prior: 0.0001
          prior_balance_student_guard: true
          student_guard_confidence_margin: 0.05
          student_guard_entropy_margin: 0.02
          lambda_same: 0.0
          lambda_override: 0.0
          override_confidence_margin: 0.04
          override_entropy_margin: 0.02
          eta_min: 0.0
          eta_max: 0.70
  m1_2_4_5_6_m3:
    ca_ccsr_wjdot:
      optimization: &default_ca_ccsr_opt
        epochs: 20
        batch_size: 32
        learning_rate: 0.00003
        weight_decay: 0.0
        max_grad_norm: 3.0
      loss: &default_ca_ccsr_loss
        adaptation_weight: 0.45
        source_ce_weight: 0.70
        source_ce_reduction: mean
        source_alpha_mode: uniform
        feature_weight: 0.06
        label_weight: 1.0
        normalize_costs: true
        transport_solver: sinkhorn
        sinkhorn_reg: 0.05
        sinkhorn_num_iter_max: 60
        use_source_class_balance: true
        alignment_start_step: 0
        alignment_ramp_steps: 300
        pseudo_weight: 0.0
        consistency_weight: 0.0
        target_label_assist_weight: 0.0
        reliability_start_ratio: 0.35
        reliability_ramp_ratio: 0.30
        reliability_total_steps: 1440
        T_class:
        top_m_per_class:
        floor:
        tau_proto: 0.85
        min_proto_samples: 3
        w_proto: 0.30
        w_ot: 0.35
        w_entropy: 0.20
        w_source_error: 0.15
        class_transport_normalize: true
        sample_outlier_downweight: false
        lambda_adv: 0.15
        lambda_ot: 0.04
        lambda_ccsr: 0.04
        lambda_teacher: 0.20
        teacher_temperature: 1.0
        teacher_anchor_mode: kl
        teacher_requires_checkpoint: true
        teacher_start_step: 0
        teacher_ramp_steps: 300
        domain_adaptation_schedule: warm_start
        domain_adaptation_max_steps: 500
        domain_adaptation_schedule_alpha: 10.0
        grl_lambda: 0.5
        grl_warm_start: true
        grl_max_iters: 500
        domain_hidden_dim: 256
        domain_num_hidden_layers: 2
        teacher_safe_fusion:
          fusion_base: prior_balanced
          prior_balance_student_mix: 0.35
          prior_balance_strength: 0.80
          prior_balance_min_prior: 0.0001
          prior_balance_student_guard: true
          student_guard_confidence_margin: 0.05
          student_guard_entropy_margin: 0.02
          lambda_same: 0.05
          lambda_override: 0.60
          override_confidence_margin: 0.04
          override_entropy_margin: 0.02
          eta_min: 0.0
          eta_max: 0.70
  m1_2_3_4_6_m5:
    ca_ccsr_wjdot:
      optimization: *default_ca_ccsr_opt
      loss:
        <<: *default_ca_ccsr_loss
        teacher_safe_fusion:
          fusion_base: prior_balanced
          prior_balance_student_mix: 0.35
          prior_balance_strength: 0.80
          prior_balance_min_prior: 0.0001
          prior_balance_student_guard: true
          student_guard_confidence_margin: 0.05
          student_guard_entropy_margin: 0.02
          lambda_same: 0.0
          lambda_override: 0.0
          override_confidence_margin: 0.04
          override_entropy_margin: 0.02
          eta_min: 0.0
          eta_max: 0.70
  m1_2_3_4_5_m6:
    ca_ccsr_wjdot:
      optimization:
        epochs: 30
      loss:
        source_ce_weight: 0.82
        lambda_adv: 0.10
        lambda_ot: 0.060
        lambda_ccsr: 0.060
        lambda_teacher: 0.08
        teacher_safe_fusion: *weak_prior_fusion

protocol_override:
  setting: multi_source
  source_domains:
    - mode1
    - mode5
  target_domain: mode2
  random_fold_enabled: false
  preferred_fold: Fold 1
  source_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  target_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  fold_sampling:
    enabled: false
    strategy: fixed
    random_per_scene: false
    random_per_run: false
    source_fold_choices: [1, 2, 3, 4, 5]
    target_fold_choices: [1, 2, 3, 4, 5]
    note: "Fold 0 in legacy CLI terms is represented here as Fold 1."
  scene_fold_overrides:
    m2_3_4_5_6_m1: &fold0_multi
      source_fold: 1
      target_fold: 1
    m1_3_4_5_6_m2: *fold0_multi
    m1_2_4_5_6_m3: *fold0_multi
    m1_2_3_5_6_m4: *fold0_multi
    m1_2_3_4_6_m5: *fold0_multi
    m1_2_3_4_5_m6: *fold0_multi

notes:
  - Five-source rescue candidate; it does not modify the locked two-source or single-source configs.
  - Runtime is deterministic/AMP-off so repeated reruns can be checked by scripts/verify_mainline_contract.py.
  - Final fusion uses guarded prior-balanced probabilities: prior balancing repairs class-count collapse, while the student guard prevents the fusion from overriding high-confidence low-entropy CA predictions.
  - m3 and m5 reset CA training to the default ca_ccsr profile; m5 now uses the same guarded prior-balanced final fusion instead of pure-student predictions.
