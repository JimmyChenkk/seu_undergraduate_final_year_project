experiment_name: tep_ot_single_source_8methods_cbtpu_anchor_rescue_20260508
seed: 42
device: cuda:0
output_dir: runs

tracking:
  batch_root_name:

runtime:
  dry_run: false
  save_checkpoint: true
  save_analysis: true
  save_figures: true
  figure_format: pdf
  deterministic: true
  deterministic_warn_only: true
  disable_cudnn: false
  cudnn_benchmark: false
  allow_tf32: false
  matmul_precision: highest
  amp: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  non_blocking_transfers: false
  show_progress: false
  evaluation_interval: 5
  selection_interval: 5
  early_stopping_interval: 5
  final_epoch_evaluation: true
  final_selection_evaluation: true
  target_eval_during_training: false
  refresh_batch_outputs: true
  early_stopping_patience:
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 120

automation:
  methods:
    - source_only
    - dsan
    - cdan_ts
    - codats
    - deepjdot
    - tpu_deepjdot
    - cbtpu_deepjdot
    - target_only
  single_source_scenes:
    - mode1->mode2
    - mode1->mode5
    - mode2->mode1
    - mode2->mode5
    - mode5->mode1
    - mode5->mode2

method_overrides:
  target_only:
    optimization:
      epochs: 120
      batch_size: 32
      learning_rate: 0.0001
      weight_decay: 0.0
      max_grad_norm: 5.0
  codats:
    backbone:
      classifier_hidden_dim: 128
  deepjdot:
    optimization: &stage1_optimization
      epochs: 120
      batch_size: 64
      learning_rate: 0.0001
      weight_decay: 0.0
      max_grad_norm: 5.0
    runtime: &stage1_runtime
      model_selection: hybrid_source_eval_confidence_guard
      early_stopping_metric: hybrid_source_eval_confidence_guard
      selection_weights:
        source_eval: 0.85
        target_confidence: 0.15
        overconfidence: 0.80
      selection_params:
        confidence_ceiling: 0.88
      early_stopping_weights:
        source_eval: 0.85
        target_confidence: 0.15
        overconfidence: 0.80
      early_stopping_params:
        confidence_ceiling: 0.88
      early_stopping_patience:
      early_stopping_min_delta: 0.0
      early_stopping_min_epochs: 120
  tpu_deepjdot:
    optimization: *stage1_optimization
    runtime: *stage1_runtime
    loss:
      adaptation_weight: 0.58
      source_warmup_steps: 450
      alignment_start_step: 450
      supcon_weight: 0.045
      prototype_cost_weight: 0.020
      prototype_start_step: 450
      prototype_warmup_steps: 750
      temporal_cost_weight: 0.012
      temporal_start_step: 450
      temporal_warmup_steps: 750
  cbtpu_deepjdot:
    optimization:
      <<: *stage1_optimization
      epochs: 80
      learning_rate: 0.00006
    runtime: *stage1_runtime
    loss:
      teacher_checkpoint_base_method: tpu_deepjdot
      initialize_student_from_teacher_checkpoint: true
      freeze_loaded_teacher: true
      prediction_fusion_mode: teacher_safe_confidence
      prediction_fusion_confidence_margin: 0.02
      prediction_fusion_student_min_confidence: 0.0
      adaptation_weight: 0.52
      source_warmup_steps: 200
      alignment_start_step: 200
      supcon_weight: 0.030
      prototype_cost_weight: 0.018
      prototype_start_step: 200
      prototype_warmup_steps: 500
      temporal_cost_weight: 0.010
      temporal_start_step: 200
      temporal_warmup_steps: 500
      teacher_temperature: 1.0
      proto_temperature: 0.18
      pseudo_weight: 0.012
      pseudo_start_step: 250
      pseudo_warmup_steps: 700
      tau_start: 0.92
      tau_end: 0.84
      tau_steps: 1100
      pseudo_max_acceptance: 0.55
      q_ot_entropy_threshold: 0.76
      js_threshold: 0.075
      consistency_weight: 0.020
      consistency_start_step: 250
      consistency_warmup_steps: 700
      consistency_mid_tau: 0.52
      logit_adjustment_eta: 0.10
      infomax_weight: 0.0015
      infomax_start_ratio: 0.75
      infomax_warmup_steps: 500
  m1_m2:
    tpu_deepjdot:
      runtime:
        model_selection: final
      loss:
        adaptation_weight: 0.62
        source_warmup_steps: 700
        alignment_start_step: 700
        supcon_weight: 0.045
        prototype_cost_weight: 0.020
        prototype_start_step: 700
        prototype_warmup_steps: 900
        temporal_cost_weight: 0.012
        temporal_start_step: 700
        temporal_warmup_steps: 900
    cbtpu_deepjdot:
      loss:
        adaptation_weight: 0.50
        pseudo_weight: 0.008
        tau_start: 0.94
        tau_end: 0.88
        pseudo_max_acceptance: 0.40
        consistency_weight: 0.014
  m1_m5:
    cbtpu_deepjdot:
      loss:
        prediction_fusion_mode: teacher_student_mix
        prediction_fusion_student_weight: 0.10
        adaptation_weight: 0.50
        pseudo_weight: 0.010
        tau_start: 0.94
        tau_end: 0.87
        pseudo_max_acceptance: 0.45
        q_ot_entropy_threshold: 0.72
  m2_m1:
    cbtpu_deepjdot:
      loss:
        prediction_fusion_mode: teacher_student_mix
        prediction_fusion_student_weight: 0.12
        adaptation_weight: 0.50
        pseudo_weight: 0.010
        consistency_weight: 0.016
        q_cls_power: 1.25
        q_proto_power: 0.85
  m2_m5:
    cbtpu_deepjdot:
      loss:
        selection_prediction_fusion_mode: teacher_safe_confidence
        selection_prediction_fusion_confidence_margin: 0.02
        selection_prediction_fusion_student_min_confidence: 0.0
        prediction_fusion_mode: teacher_student_confidence_diff_band
        prediction_fusion_confidence_diff_min: -0.40
        prediction_fusion_confidence_diff_max: 0.10
        adaptation_weight: 0.50
        pseudo_weight: 0.008
        tau_start: 0.95
        tau_end: 0.88
        pseudo_max_acceptance: 0.38
        consistency_weight: 0.012
  m5_m2:
    cbtpu_deepjdot:
      loss:
        selection_prediction_fusion_mode: teacher_safe_confidence
        selection_prediction_fusion_confidence_margin: 0.02
        selection_prediction_fusion_student_min_confidence: 0.0
        prediction_fusion_mode: teacher_student_confidence_diff_band
        prediction_fusion_confidence_diff_min: -0.40
        prediction_fusion_confidence_diff_max: 0.04

protocol_override:
  setting: single_source
  source_domains:
    - mode1
  target_domain: mode2
  random_fold_enabled: false
  preferred_fold: Fold 1
  source_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  target_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  fold_sampling:
    enabled: false
    strategy: fixed
    random_per_scene: false
    random_per_run: false
    source_fold_choices: [1, 2, 3, 4, 5]
    target_fold_choices: [1, 2, 3, 4, 5]
    note: "Fold 0 in legacy CLI terms is represented here as Fold 1."
  scene_fold_overrides:
    m1_m2: &fold0_pair
      source_fold: 1
      target_fold: 1
    m1_m5: *fold0_pair
    m2_m1: *fold0_pair
    m2_m5: *fold0_pair
    m5_m1: *fold0_pair
    m5_m2: *fold0_pair

notes:
  - Full 8-method rescue grid for the single-source mainline; do not compare the 3-method probe against missing baselines.
  - CBTPU is a second-stage refinement: automation injects the matching TPU checkpoint as teacher_checkpoint_path.
  - The loaded TPU checkpoint initializes the CBTPU student and remains a frozen teacher anchor during refinement.
  - Inference uses a target-label-free teacher-safe confidence gate: the CBTPU student replaces the TPU teacher only when its confidence exceeds the teacher by the fixed margin.
  - This protocol must be rerun as a complete batch before being promoted into the paper mainline.
