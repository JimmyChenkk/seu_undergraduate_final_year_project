experiment_name: tep_ot_single_source_m1m2_tpu_sweep_20260508
seed: 42
device: cuda:0
output_dir: runs

tracking:
  batch_root_name:

runtime:
  dry_run: false
  save_checkpoint: true
  save_analysis: true
  save_figures: true
  figure_format: pdf
  disable_cudnn: false
  cudnn_benchmark: true
  allow_tf32: true
  matmul_precision: high
  amp: true
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  non_blocking_transfers: false
  show_progress: false
  evaluation_interval: 5
  selection_interval: 5
  early_stopping_interval: 5
  final_epoch_evaluation: true
  final_selection_evaluation: true
  target_eval_during_training: false
  refresh_batch_outputs: true
  early_stopping_patience:
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 120

automation:
  methods:
    - tpu_deepjdot_m1m2_base
    - tpu_deepjdot_m1m2_source_guard
    - tpu_deepjdot_m1m2_strong
    - tpu_deepjdot_m1m2_late_align
    - tpu_deepjdot_m1m2_balanced
    - tpu_deepjdot_m1m2_noce
  single_source_scenes:
    - mode1->mode2

method_overrides:
  "*":
    runtime: &final_runtime
      model_selection: final
      early_stopping_metric: final
      early_stopping_patience:
      early_stopping_min_delta: 0.0
      early_stopping_min_epochs: 120
    optimization: &base_optimization
      epochs: 120
      batch_size: 64
      learning_rate: 0.0001
      weight_decay: 0.0
      max_grad_norm: 5.0
    loss: &base_tpu_loss
      adaptation_weight: 0.60
      adaptation_schedule: warm_start
      adaptation_max_steps: 2200
      adaptation_schedule_alpha: 10.0
      reg_dist: 0.08
      reg_cl: 1.0
      normalize_feature_cost: true
      transport_solver: sinkhorn_unbalanced
      sinkhorn_reg: 0.05
      sinkhorn_num_iter_max: 200
      unbalanced_transport: true
      uot_tau_s: 1.0
      uot_tau_t: 1.0
      use_ce_cost_for_plan: true
      source_warmup_steps: 350
      alignment_start_step: 350
      supcon_weight: 0.05
      supcon_temperature: 0.10
      supcon_warmup_only: true
      prototype_cost_weight: 0.020
      prototype_distance: normalized_l2
      prototype_momentum: 0.95
      prototype_start_step: 350
      prototype_warmup_steps: 650
      prototype_relative_min: -1.0
      prototype_relative_max: 3.0
      temporal_cost_weight: 0.012
      temporal_start_step: 350
      temporal_warmup_steps: 650
  tpu_deepjdot_m1m2_source_guard:
    loss:
      adaptation_weight: 0.57
      source_warmup_steps: 500
      alignment_start_step: 500
      supcon_weight: 0.040
      prototype_cost_weight: 0.016
      prototype_start_step: 500
      prototype_warmup_steps: 800
      temporal_cost_weight: 0.010
      temporal_start_step: 500
      temporal_warmup_steps: 800
  tpu_deepjdot_m1m2_strong:
    loss:
      adaptation_weight: 0.64
      source_warmup_steps: 300
      alignment_start_step: 300
      supcon_weight: 0.060
      prototype_cost_weight: 0.030
      prototype_start_step: 300
      prototype_warmup_steps: 600
      temporal_cost_weight: 0.018
      temporal_start_step: 300
      temporal_warmup_steps: 600
  tpu_deepjdot_m1m2_late_align:
    loss:
      adaptation_weight: 0.62
      source_warmup_steps: 700
      alignment_start_step: 700
      supcon_weight: 0.045
      prototype_cost_weight: 0.020
      prototype_start_step: 700
      prototype_warmup_steps: 900
      temporal_cost_weight: 0.012
      temporal_start_step: 700
      temporal_warmup_steps: 900
  tpu_deepjdot_m1m2_balanced:
    loss:
      adaptation_weight: 0.58
      transport_solver: sinkhorn
      unbalanced_transport: false
      use_ce_cost_for_plan: true
      source_warmup_steps: 450
      alignment_start_step: 450
      supcon_weight: 0.045
      prototype_cost_weight: 0.018
      prototype_start_step: 450
      prototype_warmup_steps: 750
      temporal_cost_weight: 0.010
      temporal_start_step: 450
      temporal_warmup_steps: 750
  tpu_deepjdot_m1m2_noce:
    loss:
      adaptation_weight: 0.60
      use_ce_cost_for_plan: false
      source_warmup_steps: 350
      alignment_start_step: 350
      supcon_weight: 0.050
      prototype_cost_weight: 0.020
      temporal_cost_weight: 0.012

protocol_override:
  setting: single_source
  source_domains:
    - mode1
  target_domain: mode2
  random_fold_enabled: false
  preferred_fold: Fold 1
  source_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  target_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  fold_sampling:
    enabled: false
    strategy: fixed
    random_per_scene: false
    random_per_run: false
    source_fold_choices: [1, 2, 3, 4, 5]
    target_fold_choices: [1, 2, 3, 4, 5]
    note: "Fold 0 in legacy CLI terms is represented here as Fold 1."
  scene_fold_overrides:
    m1_m2:
      source_fold: 1
      target_fold: 1

notes:
  - Narrow target-label-free TPU sweep for the mode1->mode2 chain break found in the 8-method rescue attempt.
  - All variants use final checkpoint selection to avoid source-confidence proxy selecting a lower target transfer checkpoint.
  - Promote a variant only after it beats the same-batch DSAN/CDAN_TS/CoDATS baselines without target labels in training or selection.
