experiment_name: tep_ot_single_source_cbtpu_edge_sweep_20260509
seed: 42
device: cuda:0
output_dir: runs

tracking:
  batch_root_name:

runtime:
  dry_run: false
  save_checkpoint: true
  save_analysis: true
  save_figures: true
  figure_format: pdf
  deterministic: true
  deterministic_warn_only: true
  disable_cudnn: false
  cudnn_benchmark: false
  allow_tf32: false
  matmul_precision: highest
  amp: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  non_blocking_transfers: false
  show_progress: false
  evaluation_interval: 5
  selection_interval: 5
  early_stopping_interval: 5
  final_epoch_evaluation: true
  final_selection_evaluation: true
  target_eval_during_training: false
  refresh_batch_outputs: true
  early_stopping_patience:
  early_stopping_min_delta: 0.0
  early_stopping_min_epochs: 120

automation:
  methods:
    - tpu_deepjdot
    - cbtpu_deepjdot_m2m5_default
    - cbtpu_deepjdot_m2m5_tpu_align
    - cbtpu_deepjdot_m2m5_student_strong
    - cbtpu_deepjdot_m2m5_ema
    - cbtpu_deepjdot_m2m5_long
  single_source_scenes:
    - mode2->mode5
    - mode5->mode2

method_overrides:
  tpu_deepjdot:
    optimization: &tpu_optimization
      epochs: 120
      batch_size: 64
      learning_rate: 0.0001
      weight_decay: 0.0
      max_grad_norm: 5.0
    runtime: &stage1_runtime
      model_selection: hybrid_source_eval_confidence_guard
      early_stopping_metric: hybrid_source_eval_confidence_guard
      selection_weights:
        source_eval: 0.85
        target_confidence: 0.15
        overconfidence: 0.80
      selection_params:
        confidence_ceiling: 0.88
      early_stopping_weights:
        source_eval: 0.85
        target_confidence: 0.15
        overconfidence: 0.80
      early_stopping_params:
        confidence_ceiling: 0.88
      early_stopping_patience:
      early_stopping_min_delta: 0.0
      early_stopping_min_epochs: 120
    loss:
      adaptation_weight: 0.58
      source_warmup_steps: 450
      alignment_start_step: 450
      supcon_weight: 0.045
      prototype_cost_weight: 0.020
      prototype_start_step: 450
      prototype_warmup_steps: 750
      temporal_cost_weight: 0.012
      temporal_start_step: 450
      temporal_warmup_steps: 750
  cbtpu_deepjdot_m2m5_default:
    optimization: &cbtpu_optimization
      epochs: 80
      batch_size: 64
      learning_rate: 0.00006
      weight_decay: 0.0
      max_grad_norm: 5.0
    runtime: *stage1_runtime
    loss: &cbtpu_base_loss
      teacher_checkpoint_base_method: tpu_deepjdot
      initialize_student_from_teacher_checkpoint: true
      freeze_loaded_teacher: true
      prediction_fusion_mode: teacher_safe_confidence
      prediction_fusion_confidence_margin: 0.02
      prediction_fusion_student_min_confidence: 0.0
      adaptation_weight: 0.52
      adaptation_schedule: warm_start
      adaptation_max_steps: 2200
      adaptation_schedule_alpha: 10.0
      reg_dist: 0.08
      reg_cl: 1.0
      normalize_feature_cost: true
      transport_solver: sinkhorn_unbalanced
      sinkhorn_reg: 0.05
      sinkhorn_num_iter_max: 200
      unbalanced_transport: true
      uot_tau_s: 1.0
      uot_tau_t: 1.0
      use_ce_cost_for_plan: true
      source_warmup_steps: 200
      alignment_start_step: 200
      supcon_weight: 0.030
      supcon_temperature: 0.10
      supcon_warmup_only: true
      prototype_cost_weight: 0.018
      prototype_distance: normalized_l2
      prototype_momentum: 0.95
      prototype_start_step: 200
      prototype_warmup_steps: 500
      prototype_relative_min: -1.0
      prototype_relative_max: 3.0
      temporal_cost_weight: 0.010
      temporal_start_step: 200
      temporal_warmup_steps: 500
      teacher_temperature: 1.0
      proto_temperature: 0.18
      pseudo_weight: 0.012
      pseudo_start_step: 250
      pseudo_warmup_steps: 700
      tau_start: 0.92
      tau_end: 0.84
      tau_steps: 1100
      pseudo_max_acceptance: 0.55
      q_ot_entropy_threshold: 0.76
      js_threshold: 0.075
      consistency_weight: 0.020
      consistency_start_step: 250
      consistency_warmup_steps: 700
      consistency_mid_tau: 0.52
      logit_adjustment_eta: 0.10
      infomax_weight: 0.0015
      infomax_start_ratio: 0.75
      infomax_warmup_steps: 500
  cbtpu_deepjdot_m2m5_tpu_align:
    optimization:
      <<: *cbtpu_optimization
      learning_rate: 0.00005
    runtime: *stage1_runtime
    loss:
      <<: *cbtpu_base_loss
      adaptation_weight: 0.58
      source_warmup_steps: 450
      alignment_start_step: 450
      prototype_start_step: 450
      prototype_warmup_steps: 750
      temporal_start_step: 450
      temporal_warmup_steps: 750
      pseudo_weight: 0.010
      tau_start: 0.94
      tau_end: 0.87
      pseudo_max_acceptance: 0.42
      consistency_weight: 0.014
  cbtpu_deepjdot_m2m5_student_strong:
    optimization:
      <<: *cbtpu_optimization
      epochs: 90
      learning_rate: 0.00005
    runtime: *stage1_runtime
    loss:
      <<: *cbtpu_base_loss
      prediction_fusion_mode: student
      adaptation_weight: 0.56
      pseudo_weight: 0.016
      tau_start: 0.91
      tau_end: 0.82
      pseudo_max_acceptance: 0.62
      consistency_weight: 0.024
      q_ot_entropy_threshold: 0.78
  cbtpu_deepjdot_m2m5_ema:
    optimization:
      <<: *cbtpu_optimization
      epochs: 90
      learning_rate: 0.00005
    runtime: *stage1_runtime
    loss:
      <<: *cbtpu_base_loss
      freeze_loaded_teacher: false
      prediction_fusion_confidence_margin: 0.02
      adaptation_weight: 0.54
      pseudo_weight: 0.014
      pseudo_max_acceptance: 0.50
      consistency_weight: 0.020
  cbtpu_deepjdot_m2m5_long:
    optimization:
      <<: *cbtpu_optimization
      epochs: 120
      learning_rate: 0.00004
    runtime: *stage1_runtime
    loss:
      <<: *cbtpu_base_loss
      adaptation_weight: 0.54
      pseudo_weight: 0.010
      tau_start: 0.94
      tau_end: 0.86
      pseudo_max_acceptance: 0.45
      consistency_weight: 0.016

protocol_override:
  setting: single_source
  source_domains:
    - mode2
  target_domain: mode5
  random_fold_enabled: false
  preferred_fold: Fold 1
  source_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  target_folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  fold_sampling:
    enabled: false
    strategy: fixed
    random_per_scene: false
    random_per_run: false
    source_fold_choices: [1, 2, 3, 4, 5]
    target_fold_choices: [1, 2, 3, 4, 5]
    note: Fold 0 in legacy CLI terms is represented here as Fold 1.
  scene_fold_overrides:
    m2_m5: &fold1
      source_fold: 1
      target_fold: 1
    m5_m2: *fold1

notes:
  - Targeted rescue sweep for edge cases where TPU exceeded CBTPU in the full 8-method deterministic batch.
  - Current failing scenes are mode2->mode5 and mode5->mode2.
  - Keep TPU first so automation injects the matching teacher checkpoint into each CBTPU variant.
